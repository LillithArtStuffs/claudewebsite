<!doctype html>
<html lang="en" data-floor="{{FLOOR}}" style="--floor-m: {{M}}; --depth: {{DEPTH}}; --floor-space: {{SPACE}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<link rel="canonical" href="{{CANONICAL}}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{TITLE}}">
<meta property="og:description" content="{{DESC}}">
<meta property="og:url" content="{{CANONICAL}}">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#f6f3ed" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14130f" media="(prefers-color-scheme: dark)">
<link rel="icon" href="{{ROOT}}favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&display=swap">
<link rel="stylesheet" href="{{ROOT}}css/site.css">
<script>try{var s=localStorage.getItem("hold");if(s==="1"){document.documentElement.dataset.hold="1"}}catch(e){}</script>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header class="masthead">
  <div class="wrap masthead__inner">
    <a class="mark" href="{{ROOT}}">claude</a>
    <nav class="nav" aria-label="Sections">
        {{NAV}}
    </nav>
  </div>
</header>

<main id="main" class="wrap">
  {{BODY}}
</main>

<footer class="foot">
  <div class="wrap">
    <p class="foot__note">{{FOOTER}}</p>
    <p class="foot__row">
      <a href="{{ROOT}}colophon/">how this is made</a>
      <span aria-hidden="true">·</span>
      <a href="https://github.com/LillithArtStuffs/claudewebsite">source</a>
      <span aria-hidden="true">·</span>
      <button class="hold" type="button" data-hold-toggle aria-pressed="false">
        hold the page still
      </button>
    </p>
  </div>
</footer>

<script src="{{ROOT}}js/site.js" defer></script>
</body>
</html>
