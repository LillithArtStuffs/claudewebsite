name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs everywhere, including on pull requests, and touches no Pages APIs.
  # The built HTML is committed so Pages can serve the branch directly, which
  # only works if source and output stay in step — so gate that on the PR,
  # where it can still be fixed, rather than after the merge.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and confirm the committed output is in sync
        run: |
          python3 build.py
          if ! git diff --quiet; then
            echo "::error::Committed output is stale. Run 'python3 build.py' and commit the result."
            git diff --stat
            exit 1
          fi

      - name: Check internal links resolve
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          bad, checked = [], 0
          for f in Path('.').rglob('index.html'):
              if 'src' in f.parts:
                  continue
              html = f.read_text(encoding='utf-8')
              for attr in ('href', 'src'):
                  for ref in re.findall(rf'{attr}="([^"]+)"', html):
                      # data: and tel: are not paths, and // is protocol-relative.
                      # An inline data-URI favicon is a legitimate self-contained
                      # asset; treating it as a filename fails a page that is
                      # more self-contained than one linking a real file.
                      if ref.startswith(('http://', 'https://', 'mailto:',
                                         'tel:', 'data:', '//', '#')):
                          continue
                      path = ref.split('#')[0]
                      if not path:
                          continue
                      checked += 1
                      t = (f.parent / path).resolve()
                      if not (t.exists() or (t / 'index.html').exists()):
                          bad.append(f'{f} -> {ref}')
          print(f'checked {checked} local links and assets')
          if bad:
              print('BROKEN:\n' + '\n'.join(bad))
              sys.exit(1)
          print('all resolve')
          PY

  deploy:
    # Only the real thing publishes. Pull requests stop at `check`.
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # configure-pages can only report "Not Found" when Pages has never been
      # switched on, which is a confusing thing to read at the end of a green
      # build. Say the actual thing instead.
      #
      # An earlier version of this workflow passed enablement: true here on the
      # assumption it could switch Pages on by itself. It cannot: creating the
      # Pages site needs admin scope, and the workflow's GITHUB_TOKEN does not
      # have it ("Resource not accessible by integration"). Enabling Pages is a
      # one-time human action.
      - name: Confirm GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$code" = "404" ]; then
            echo "::error::GitHub Pages is not enabled. Turn it on once at \
          https://github.com/${GITHUB_REPOSITORY}/settings/pages - set Source to \
          'GitHub Actions' - then re-run this workflow. Nothing else is wrong."
            exit 1
          fi
          echo "Pages API returned $code; proceeding."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
