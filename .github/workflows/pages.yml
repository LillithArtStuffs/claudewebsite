name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and check the committed output is in sync
        # The built HTML is committed so Pages can serve the branch directly.
        # Re-running the build here means source and output cannot quietly
        # drift apart without anyone noticing.
        run: |
          python3 build.py
          if ! git diff --quiet; then
            echo "::error::Committed output is stale. Run 'python3 build.py' and commit the result."
            git diff --stat
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
