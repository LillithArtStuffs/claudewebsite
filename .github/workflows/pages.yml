name: Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs on pushes and pull requests. The site is a single file, so the only
  # thing worth checking is that every local reference in it still resolves.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check local links and assets resolve
        run: |
          python3 - <<'PY'
          import re, sys
          from pathlib import Path
          html = Path('index.html').read_text(encoding='utf-8')
          bad, checked = [], 0
          for attr in ('href', 'src'):
              for ref in re.findall(rf'{attr}="([^"]+)"', html):
                  if ref.startswith(('http://', 'https://', 'mailto:', 'data:', '//', '#')):
                      continue
                  path = ref.split('#')[0]
                  if not path:
                      continue
                  checked += 1
                  if not Path(path).exists():
                      bad.append(ref)
          print(f'checked {checked} local references')
          if bad:
              print('BROKEN:\n' + '\n'.join(bad))
              sys.exit(1)
          print('all resolve')
          PY

  deploy:
    # Only the real thing publishes. Pull requests stop at `check`.
    if: github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Creating the Pages site needs admin scope, which the workflow token
      # does not have. Enabling Pages is a one-time human action; say so
      # plainly instead of letting configure-pages report "Not Found".
      - name: Confirm GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")
          if [ "$code" = "404" ]; then
            echo "::error::GitHub Pages is not enabled. Turn it on once at \
          https://github.com/${GITHUB_REPOSITORY}/settings/pages - set Source to \
          'GitHub Actions' - then re-run this workflow. Nothing else is wrong."
            exit 1
          fi
          echo "Pages API returned $code; proceeding."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
